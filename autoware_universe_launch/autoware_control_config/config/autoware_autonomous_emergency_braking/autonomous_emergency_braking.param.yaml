# Source: https://github.com/autowarefoundation/autoware_universe/blob/659b6b3836406bc33f257798c1ae41374a72c501/control/autoware_autonomous_emergency_braking/config/autonomous_emergency_braking.param.yaml

/**:
  ros__parameters:
    # Ego path calculation
    use_predicted_trajectory: true
    use_imu_path: false
    limit_imu_path_lat_dev: false
    limit_imu_path_length: true
    use_pointcloud_data: true
    use_predicted_object_data: false
    use_object_velocity_calculation: true
    check_autoware_state: true
    imu_path_lat_dev_threshold: 3.0
    min_generated_imu_path_length: 2.0
    max_generated_imu_path_length: 20.0
    imu_prediction_time_horizon: 4.0
    imu_prediction_time_interval: 0.2
    mpc_prediction_time_horizon: 8.0
    mpc_prediction_time_interval: 0.15

    # Debug
    publish_debug_pointcloud: false
    publish_debug_markers: true

    # Point cloud partitioning
    detection_range_min_height: 0.0
    detection_range_max_height_margin: 0.5
    voxel_grid_x: 0.2
    voxel_grid_y: 0.2
    voxel_grid_z: 0.5

    # Point cloud cropping
    expand_width: 0.3
    path_footprint_extra_margin: 2.0
    speed_calculation_expansion_margin: 1.5

    # Point cloud clustering
    cluster_tolerance: 0.4 #[m]
    cluster_minimum_height: 0.1
    minimum_cluster_size: 15
    maximum_cluster_size: 10000

    # RSS distance collision check
    longitudinal_offset_margin: 3.0
    t_response: 5.0
    a_ego_min: -0.8
    a_obj_min: -0.5
    collision_keeping_sec: 6.0
    previous_obstacle_keep_time: 2.0
    aeb_hz: 10.0

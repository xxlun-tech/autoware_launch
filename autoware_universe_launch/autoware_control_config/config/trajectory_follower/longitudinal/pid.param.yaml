# This file is managed by sync-params workflow.
# DO NOT EDIT THIS FILE DIRECTLY FOR ADDING OR REMOVING FIELDS. Follow these steps:
#
# 1. Modify the param file in the upstream repository.
# 2. Run the sync-params workflow or run `python .github/scripts/sync_params.py control` to update this file.
# 3. If local changes are needed, annotate them with an override marker (see below).
#
# Keys marked with '{OVERRIDE}' or '# {OVERRIDE: reason}' are persisted as variant overrides.
# 'reason' can be any single-line text without braces.
# To keep local changes, annotate fields with '# {OVERRIDE}' or '# {OVERRIDE: reason}'.
#
# Source: https://github.com/autowarefoundation/autoware_universe/blob/ca311943e60290ae386c5f81da9b9ea3325807d4/control/autoware_pid_longitudinal_controller/config/autoware_pid_longitudinal_controller.param.yaml

/**:
  ros__parameters:
    delay_compensation_time: 0.8 # {OVERRIDE}

    enable_smooth_stop: true
    enable_overshoot_emergency: false # {OVERRIDE}
    enable_large_tracking_error_emergency: true
    enable_slope_compensation: false
    enable_keep_stopped_until_steer_convergence: true

    # state transition
    drive_state_stop_dist: 2.0
    drive_state_offset_stop_dist: 3.0
    stopping_state_stop_dist: 1.5 # {OVERRIDE}
    stopped_state_entry_duration_time: 1.0
    stopped_state_entry_vel: 0.2
    stopped_state_entry_acc: 0.05
    emergency_state_overshoot_stop_dist: 4.0

    # drive state
    kp: 0.4
    ki: 0.3
    kd: 0.0
    max_out: 1.0
    min_out: -1.0
    max_p_effort: 1.0
    min_p_effort: -1.0
    max_i_effort: 0.5
    min_i_effort: -0.5
    max_d_effort: 0.0
    min_d_effort: 0.0
    lpf_vel_error_gain: 0.7
    enable_integration_at_low_speed: true
    current_vel_threshold_pid_integration: 0.2
    time_threshold_before_pid_integration: 3.0
    ff_scale_min: 0.3
    ff_scale_max: 3.0
    enable_brake_keeping_before_stop: false
    brake_keeping_acc: -0.1

    # smooth stop state
    smooth_stop_max_strong_acc: -0.3
    smooth_stop_min_strong_acc: -0.5
    smooth_stop_weak_acc: -0.15
    smooth_stop_weak_stop_acc: -0.4
    smooth_stop_strong_stop_acc: -1.0
    smooth_stop_max_fast_vel: 0.3
    smooth_stop_min_running_vel: 0.1
    smooth_stop_min_running_acc: 0.02
    smooth_stop_weak_stop_time: 2.0
    smooth_stop_weak_stop_dist: -1.0
    smooth_stop_strong_stop_dist: -1.5

    # stopped state
    stopped_vel: 0.0
    stopped_acc: -0.5 # denotes pedal position

    # emergency state
    emergency_vel: 0.0
    emergency_acc: -1.5 # denotes acceleration
    emergency_jerk: -0.8

    # acceleration feedback
    lpf_acc_error_gain: 0.95
    acc_feedback_gain: 0.0

    # acceleration limit
    max_acc: 0.8
    min_acc: -1.5

    # jerk limit
    max_jerk: 0.5
    min_jerk: -1.0
    max_acc_cmd_diff: 10.0 # [m/s^2 * s^-1]

    # slope compensation
    lpf_pitch_gain: 0.95
    slope_source: "raw_pitch" # {OVERRIDE} raw_pitch, trajectory_pitch, trajectory_adaptive or trajectory_goal_adaptive
    adaptive_trajectory_velocity_th: 1.0
    max_pitch_rad: 0.0
    min_pitch_rad: 0.0

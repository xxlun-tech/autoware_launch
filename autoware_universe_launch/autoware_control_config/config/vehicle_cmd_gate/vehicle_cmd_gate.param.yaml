/**:
  ros__parameters:
    update_rate: 10.0
    system_emergency_heartbeat_timeout: 1.0
    use_emergency_handling: true
    check_external_emergency_heartbeat: $(var check_external_emergency_heartbeat)
    enable_cmd_limit_filter: true
    filter_activated_count_threshold: 5
    filter_activated_velocity_threshold: 0.5
    external_emergency_stop_heartbeat_timeout: 0.0
    stop_hold_acceleration: -0.5
    emergency_acceleration: -1.0
    moderate_stop_service_acceleration: -0.5
    stop_check_duration: 2.0
    nominal:
      vel_lim: 5.0
      reference_speed_points: [0.1, 0.5, 3.0, 5.0]
      steer_cmd_lim: [1.0, 1.0, 1.0, 0.8]
      steer_rate_lim_for_steer_cmd: [0.25, 0.25, 0.2, 0.15]
      lon_acc_lim_for_lon_vel: [1.0, 1.0, 0.8, 0.5]
      lon_jerk_lim_for_lon_acc: [10.0, 1.0, 0.8, 0.5]  # The first element is required for quick pedal changes when stopping and starting.
      lat_acc_lim_for_steer_cmd: [1.5, 1.5, 1.2, 0.8]
      lat_jerk_lim_for_steer_cmd: [1.5, 1.5, 1.2, 0.8]
      lat_jerk_lim_for_steer_rate: 2.0
      steer_cmd_diff_lim_from_current_steer: [0.5, 0.5, 0.4, 0.3]
    on_transition:
      vel_lim: 6.0
      reference_speed_points: [3.0, 5.0]
      steer_cmd_lim: [1.0, 0.8]
      steer_rate_lim_for_steer_cmd: [0.2, 0.15]
      lon_acc_lim_for_lon_vel: [0.5, 0.4]
      lon_jerk_lim_for_lon_acc: [0.3, 0.25]
      lat_acc_lim_for_steer_cmd: [0.8, 0.6]
      lat_jerk_lim_for_steer_cmd: [1.0, 0.8]
      lat_jerk_lim_for_steer_rate: 1.5
      steer_cmd_diff_lim_from_current_steer: [0.4, 0.3]

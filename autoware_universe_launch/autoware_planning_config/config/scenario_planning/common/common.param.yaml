/**:
  ros__parameters:
    max_vel: 3.0           # max velocity limit [m/s]

    # constraints param for normal driving
    normal:
      min_acc: -0.15         # min deceleration [m/ss]
      max_acc: 0.2          # max acceleration [m/ss]
      min_jerk: -0.2        # min jerk [m/sss]
      max_jerk: 0.3         # max jerk [m/sss]

    # constraints to be observed
    limit:
      min_acc: -0.5         # min deceleration limit [m/ss]
      max_acc: 0.6          # max acceleration limit [m/ss]
      min_jerk: -0.4        # min jerk limit [m/sss]
      max_jerk: 0.5         # max jerk limit [m/sss]

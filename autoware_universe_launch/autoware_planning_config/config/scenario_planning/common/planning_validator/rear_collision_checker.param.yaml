/**:
  ros__parameters:
    common:
      on_time_buffer: 1.5
      off_time_buffer: 3.0
      check_on_unstoppable: false

      pointcloud:
        range:
          dead_zone: 0.3
          buffer: 1.0
        crop_box_filter:
          x:
            max: 30.0
            min: -100.0
          z:
            max: -1.0
            min: 0.3
        voxel_grid_filter:
          x: 0.1
          y: 0.1
          z: 0.5
        clustering:
          cluster_tolerance: 0.15
          min_cluster_height: 0.1
          min_cluster_size: 5
          max_cluster_size: 10000
        velocity_estimation:
          observation_time: 0.3
          max_acceleration: 10.0
        latency: 0.3

      filter:
        min_velocity: 0.3
        moving_time: 1.5

      time_to_collision:
        margin: 5.0

      ego:
        reaction_time: 3.0
        min_velocity: 0.3
        max_velocity: 5.0
        max_acceleration: 0.3
        max_deceleration: -0.4
        max_positive_jerk: 0.3
        max_negative_jerk: -0.3
        nominal_deceleration: -0.25
        nominal_positive_jerk: 0.15
        nominal_negative_jerk: -0.15

      blind_spot:
        lookahead_time: 8.0
        metric: ttc
        check:
          front: true
          left: true
          right: true
          yaw_th: 1.57
        offset:
          inner: 1.0
          outer: 2.0
        participants:
          reaction_time: 3.0
          max_velocity: 3.0
          max_deceleration: -0.3

      adjacent_lane:
        lookahead_time: 8.0
        metric: rss
        check:
          front: true
        offset:
          left: -1.5
          right: -1.5
        participants:
          reaction_time: 3.0
          max_velocity: 3.0
          max_deceleration: -0.3

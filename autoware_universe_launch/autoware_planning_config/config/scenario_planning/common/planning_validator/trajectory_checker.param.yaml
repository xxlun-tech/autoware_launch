/**:
  ros__parameters:
    trajectory_checker:
      interval:
        enable: true
        threshold: 5.0
      curvature:
        enable: true
        threshold: 0.05
      relative_angle:
        enable: true
        threshold: 0.3
      lateral_accel:
        enable: true
        threshold: 0.25
      min_lon_accel:
        enable: true
        threshold: -0.4
      max_lon_accel:
        enable: true
        threshold: 0.4
      lateral_jerk:
        enable: true
        threshold: 0.2
      steering:
        enable: true
        threshold: 0.5
      steering_rate:
        enable: true
        threshold: 0.1
      distance_deviation:
        enable: true
        threshold: 5.0
      lon_distance_deviation:
        enable: true
        threshold: 2.0
      velocity_deviation:
        enable: true
        threshold: 2.0
      yaw_deviation:
        enable: true
        threshold: 0.5
        th_trajectory_yaw_shift: 0.1
      forward_trajectory_length:
        enable: true
        acceleration: -0.4
        margin: 5.0
      trajectory_shift:
        enable: true
        lat_shift_th: 1.0
        forward_shift_th: 2.0
        backward_shift_th: 0.5
        handling_type: 2
        override_error_diag: false

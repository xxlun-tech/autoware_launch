/**:
  ros__parameters:
    lane_change:
      time_limit: 50.0 # [ms]
      backward_lane_length: 60.0
      backward_length_buffer_for_end_of_lane: 8.0 # [m]
      backward_length_buffer_for_blocking_object: 8.0 # [m]
      backward_length_from_intersection: 5.0 # [m]
      enable_stopped_vehicle_buffer: false
      overhang_tolerance: 1.0 # [m]

      # turn signal
      min_length_for_turn_signal_activation: 10.0 # [m]

      # terminal path
      terminal_path:
        enable: true
        disable_near_goal: true
        stop_at_boundary: false

      # trajectory generation
      trajectory:
        max_prepare_duration: 6.0
        min_prepare_duration: 4.0
        lateral_jerk: 0.15
        min_longitudinal_acc: -0.25
        max_longitudinal_acc: 0.4
        th_prepare_length_diff: 2.0
        th_lane_changing_length_diff: 2.0
        min_lane_changing_velocity: 1.5
        lon_acc_sampling_num: 5
        lat_acc_sampling_num: 3
        lane_changing_decel_factor: 0.3
        th_prepare_curvature: 0.02 # [/]

      # delay lane change
      delay_lane_change:
        enable: false
        check_only_parked_vehicle: false
        min_road_shoulder_width: 0.5  # [m]
        th_parked_vehicle_shift_ratio: 0.6

      # trajectory generation near terminal using frenet planner
      frenet:
        enable: false
        use_entire_remaining_distance: false
        th_yaw_diff: 10.0  # [deg]
        th_curvature_smoothing: 0.1 # [/]
        th_average_curvature: 0.020 # [/]

      # safety check
      safety_check:
        allow_loose_check_for_cancel: true
        enable_target_lane_bound_check: true
        stopped_object_velocity_threshold: 0.10          # [m/s] Object whose velocity is less than the threshold is treated as static object.
        prepare:                                        # RSS parameters used during the prepare phase, regardless of whether the ego is searching for a safe path, canceling, or transitioning to another state.
          expected_front_deceleration: -0.3             # [m/s2]
          expected_rear_deceleration: -0.3              # [m/s2]
          rear_vehicle_reaction_time: 3.0               # [s]
          rear_vehicle_safety_time_margin: 2.0          # [s]
          lateral_distance_max_threshold: 3.0           # [m]
          longitudinal_distance_min_threshold: 8.0      # [m]
          longitudinal_velocity_delta_time: 0.0         # [s]
          extended_polygon_policy: "along_path"         # [-] available options are `rectangle` or `along_path`
        execution:
          expected_front_deceleration: -0.3
          expected_rear_deceleration: -0.3
          rear_vehicle_reaction_time: 5.0
          rear_vehicle_safety_time_margin: 3.0
          lateral_distance_max_threshold: 5.0
          longitudinal_distance_min_threshold: 10.0
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"
        parked:
          expected_front_deceleration: -0.3
          expected_rear_deceleration: -0.3
          rear_vehicle_reaction_time: 3.0
          rear_vehicle_safety_time_margin: 2.0
          lateral_distance_max_threshold: 3.0
          longitudinal_distance_min_threshold: 8.0
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"
        cancel:
          expected_front_deceleration: -0.3
          expected_rear_deceleration: -0.3
          rear_vehicle_reaction_time: 3.0
          rear_vehicle_safety_time_margin: 2.0
          lateral_distance_max_threshold: 3.0
          longitudinal_distance_min_threshold: 8.0
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"
        stuck:
          expected_front_deceleration: -0.3
          expected_rear_deceleration: -0.3
          rear_vehicle_reaction_time: 5.0
          rear_vehicle_safety_time_margin: 3.0
          lateral_distance_max_threshold: 5.0
          longitudinal_distance_min_threshold: 10.0
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"

        # lane expansion for object filtering
        lane_expansion:
          left_offset: 2.0 # [m]
          right_offset: 2.0 # [m]

      # lateral acceleration map
      lateral_acceleration:
        velocity: [0.0, 1.5, 3.0]
        min_values: [0.10, 0.12, 0.15]
        max_values: [0.15, 0.20, 0.25]

      # target object
      target_object:
        car: false
        truck: false
        bus: false
        trailer: false
        unknown: true
        bicycle: false
        motorcycle: false
        pedestrian: false

      # collision check
      collision_check:
        prediction_time_resolution: 0.5
        th_incoming_object_yaw: 2.3562 # [rad]
        yaw_diff_threshold: 3.1416 # [rad]
        check_current_lanes: true
        check_other_lanes: true
        use_all_predicted_paths: true

      # lane change regulations
      regulation:
        crosswalk: false
        intersection: false
        traffic_light: false

      # ego vehicle stuck detection
      stuck_detection:
        velocity: 0.15 # [m/s]
        stop_time: 5.0 # [s]

      # lane change cancel
      cancel:
        enable_on_prepare_phase: true
        enable_on_lane_changing_phase: false
        delta_time: 2.0                     # [s]
        duration: 8.0                       # [s]
        max_lateral_jerk: 0.5             # [m/s3]
        overhang_tolerance: 0.0             # [m]
        unsafe_hysteresis_threshold: 5      # [/]
        deceleration_sampling_num: 1        # [/] Used to sample the approved lane change path, specifically for checking safety against leading objects.

      lane_change_finish_judge_buffer: 3.0      # [m]
      finish_judge_lateral_threshold: 0.3        # [m]
      finish_judge_lateral_angle_deviation: 3.0 # [deg]

      # path miss detection
      path_miss:
        enable_path_miss_detection: true  # enable/disable path miss detection
        threshold_longitudinal: 2.0       # [m] - max longitudinal deviation from lc end allowed (fixed, no scaling)

        # path miss velocity scaling parameters
        # Lateral threshold will be dynamically scaled based on ego velocity using these interpolation points
        # At zero speed: stricter tolerance (to update lc path when ego is stopped)
        # At low speeds: higher tolerance (to allow ego to follow lc path)
        # At high speeds: stricter tolerance (to update lc path when ego is moving)
        velocity_points: [ 0.0, 0.5, 0.6, 1.5, 1.6, 3.0 ]   # [m/s] - velocity points for interpolation
        lateral_thresholds: [ 4.0, 4.0, 3.0,  3.0,  1.5,   1.0 ]     # corresponding lateral thresholds [m]

      # debug
      publish_debug_marker: false

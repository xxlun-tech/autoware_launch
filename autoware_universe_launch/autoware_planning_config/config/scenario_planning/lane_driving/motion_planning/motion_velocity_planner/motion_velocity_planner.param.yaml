/**:
  ros__parameters:
    smooth_velocity_before_planning: true

    trajectory_polygon_collision_check:
      decimate_trajectory_step_length: 1.5
      goal_extended_trajectory_length: 10.0

      # consider the current ego pose (it is not the nearest pose on the reference trajectory)
      # Both the lateral error and the yaw error are assumed to decrease to zero by the time duration "time_to_convergence"
      # The both errors decrease with constant rates against the time.
      consider_current_pose:
        enable_to_consider_current_pose: true
        time_to_convergence: 3.0

    pointcloud_preprocessing:
      filter_by_trajectory_polygon:
        enable_monolithic_crop_box: true
        enable_multi_polygon_filtering: false
        min_trajectory_length: 20.0
        braking_distance_scale_factor: 2.0
        lateral_margin: 3.0
        height_margin: 1.0
      downsample_by_voxel_grid:
        enable_downsample: true
        voxel_size_x: 0.3
        voxel_size_y: 0.3
        voxel_size_z: 0.5
      euclidean_clustering:
        enable_clustering: false
        cluster_tolerance: 1.5
        min_cluster_size: 1
        max_cluster_size: 100000

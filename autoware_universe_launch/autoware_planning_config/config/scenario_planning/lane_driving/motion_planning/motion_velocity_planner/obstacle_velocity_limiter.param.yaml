/**:
  ros__parameters:
    min_ttc: 4.0
    distance_buffer: 2.0
    min_adjusted_velocity: 0.5
    max_deceleration: 0.4

    trajectory_preprocessing:
      start_distance: 0.0
      max_length: 50.0
      max_duration: 30.0
      downsample_factor: 10
      calculate_steering_angles: false

    simulation:
      model: particle
      distance_method: exact
      steering_offset: 0.01
      nb_points: 5

    obstacles:
      dynamic_source: static_only
      ignore_obstacles_on_path: false
      ignore_extra_distance: 2.0
      occupancy_grid_threshold: 120
      dynamic_obstacles_buffer: 3.0
      dynamic_obstacles_min_vel: 0.2
      static_map_tags:
        - guard_rail
      filter_envelope : false
      rtree_min_points: 500
      rtree_min_segments: 1600

/**:
  ros__parameters:
    out_of_lane:
      mode: ttc
      skip_if_already_overlapping: false
      max_arc_length: 50.0

      threshold:
        time_threshold: 5.0
      ttc:
        threshold: 4.0
        release_threshold: 8.0

      objects:
        minimum_velocity: 0.2
        predicted_path_min_confidence : 0.1
        cut_predicted_paths_beyond_red_lights: false
        ignore_behind_ego: false
        validate_predicted_paths_on_lanelets: false
        extra_width: 2.0

      action:
        use_map_stop_lines: false
        precision: 0.1
        longitudinal_distance_buffer: 4.0
        lateral_distance_buffer: 2.5
        min_on_duration: 1.0
        min_off_duration: 3.0
        update_distance_th: 5.0
        slowdown:
          distance_threshold: 15.0
          velocity: 0.8
        stop:
          distance_threshold: 8.0

      ego:
        extra_front_offset: 1.0
        extra_rear_offset: 1.0
        extra_right_offset: 1.0
        extra_left_offset: 1.0

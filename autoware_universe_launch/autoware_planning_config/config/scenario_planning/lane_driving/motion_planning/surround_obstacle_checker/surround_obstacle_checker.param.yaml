/**:
  ros__parameters:
    # obstacle check
    # surround_check_*_distance: if objects exist in this distance, transit to "exist-surrounding-obstacle" status [m]
    # surround_check_hysteresis_distance: if no object exists in this hysteresis distance added to the above distance, transit to "non-surrounding-obstacle" status [m]
    pointcloud:
      enable_check: true
      surround_check_front_distance: 2.0
      surround_check_side_distance: 2.0
      surround_check_back_distance: 2.0
    unknown:
      enable_check: true
      surround_check_front_distance: 2.0
      surround_check_side_distance: 2.0
      surround_check_back_distance: 2.0
    car:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.0
      surround_check_back_distance: 0.0
    truck:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.0
      surround_check_back_distance: 0.0
    bus:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.0
      surround_check_back_distance: 0.0
    trailer:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.0
      surround_check_back_distance: 0.0
    motorcycle:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.0
      surround_check_back_distance: 0.5
    bicycle:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    pedestrian:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    animal:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    hazard:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    over_drivable:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    under_drivable:
      enable_check: false
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5

    surround_check_hysteresis_distance: 1.0

    state_clear_time: 1.0

    # ego stop state
    stop_state_ego_speed: 0.1 #[m/s]

    # debug
    publish_debug_footprints: false
    debug_footprint_label: "car"
